[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-parser"
version = "0.1.0"
description = "Daily baby food price collector for Russian retail/e-commerce stores."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "camoufox>=0.4.11",
  "google-api-python-client>=2.130.0",
  "google-auth>=2.30.0",
  "httpx>=0.27.0",
  "openpyxl>=3.1.0",
  # Variti-магазины (samokat/perekrestok/onlinetrade): patchright управляет настоящим
  # Chrome без следов автоматизации; pyvirtualdisplay даёт ему дисплей на сервере.
  # Версия в ногу с playwright (<1.49), иначе конфликт по pyee.
  "patchright>=1.45.0,<1.49",
  "pyvirtualdisplay>=3.0; platform_system != 'Windows'",
  # <1.49: версия должна совпадать с базовым Docker-образом (v1.48.0), иначе
  # playwright ищет chromium не той сборки. И не выше 1.4x: новые драйверы
  # несовместимы с camoufox 0.4.x (Node-драйвер падает с TypeError reading url).
  "playwright>=1.45.0,<1.49",
  "pydantic-settings>=2.3.0",
  "tenacity>=8.3.0",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]

[project.scripts]
market-parser = "market_parser.cli:main"

[tool.setuptools.packages.find]
include = ["market_parser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
